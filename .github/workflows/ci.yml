# Continuous integration: the pull request check, the full check on main,
# and every night the extended run (MemorySanitizer, the macOS and iOS
# sanitizer cells, Linux on arm64, quarantined pages, long fuzzing), which
# a dispatch with nightly set runs by hand, the same in every setting. Each
# desktop build cell is a CMake preset built by the organization's shared
# workflow; the cells that need a simulator, an emulator or a browser, and
# the other jobs, are here, each through its preset too.
# docs/operations/checks.md explains each job, and tools/check.sh runs the
# Linux ones locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: The nightly extended run, as the schedule runs it
        type: boolean
        default: false

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  PREFIX: MAUL_AUDIO

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@8414d388d2116b581c5c5d8f6641e1da4d863244 # v0.0.42
    permissions:
      pull-requests: read

  # The organization's documentation check. data/hrtf/apache-2.0 holds the
  # HRTF set's license exactly as published.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rawframe-Project/.github/.github/actions/docs-check@8414d388d2116b581c5c5d8f6641e1da4d863244 # v0.0.42
        with:
          exclude: data/hrtf/apache-2.0

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@8414d388d2116b581c5c5d8f6641e1da4d863244 # v0.0.42
    permissions:
      contents: read

  # The rules no compiler checks: formatting, the family's source, module,
  # length, API documentation, snippet and test hygiene checks, the
  # engine-free API, the README's cost table, the documentation site, and
  # clang-tidy over the Linux build's sources. It runs on documentation changes too, since the
  # snippet check and the site read docs/.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
    permissions:
      contents: read
    steps:
      # The whole history, for the release tags the patch release check
      # compares with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: clang-format
        run: |
          clang-format --version
          mapfile -t files < <(git ls-files 'include/*.h' 'src/*.[chm]' 'test/*.[chm]' 'tools/*.[ch]' \
            'bench/*.[ch]' 'samples/*.[ch]')
          [ ${#files[@]} -gt 0 ] || { echo "::error::no C files to check"; exit 1; }
          clang-format --dry-run -Werror "${files[@]}"
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_float_env.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
          python3 tools/check_litmus.py
          python3 tools/check_patch_results.py --self-test
          python3 tools/check_patch_results.py
      # The rules' own fixtures, then the tree, then every test carrying a
      # label in each configuration that adds tests: linux-gcc-14 (every
      # Linux backend, the package test), a static Debug build with the
      # private backend (the audio-thread trap, private_backend), and the
      # shared build (its exports).
      - name: Test hygiene
        run: |
          python3 tools/check_test_hygiene.py --self-test
          python3 tools/check_test_hygiene.py
          cmake --preset linux-gcc-14 >/dev/null
          cmake -B out/hygiene-debug -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_BUILD_TYPE=Debug \
            "-D${PREFIX}_PRIVATE_BACKEND=$PWD/test/private_backend" >/dev/null
          cmake -B out/hygiene-shared -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_BUILD_TYPE=Release \
            "-D${PREFIX}_BUILD_SHARED=ON" "-D${PREFIX}_TEST_PACKAGE=ON" >/dev/null
          python3 tools/check_test_hygiene.py --ctest out/linux-gcc-14 --ctest out/hygiene-debug \
            --ctest out/hygiene-shared
      - name: README cost table
        run: python3 tools/cost_table.py --check
      - name: The documentation site builds
        run: python3 tools/build_docs.py
      - name: clang-tidy
        # The Linux build's sources, on the Release preset, where the
        # assertions compile out, and with them live: each hides findings the
        # other shows. The other platforms' code is compiled with warnings as
        # errors by its own cell.
        run: |
          for build in Release Debug; do
            echo "::group::clang-tidy, $build"
            cmake --preset linux-clang-20 -B "out/tidy-$build" -DCMAKE_BUILD_TYPE=$build \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -D${PREFIX}_BUILD_TESTS=OFF
            mapfile -t files < <(python3 -c "import json, sys; sys.stdout.write(''.join(f + '\n' for f in sorted({e['file'] for e in json.load(open('out/tidy-$build/compile_commands.json')) if '/src/' in e['file']})))")
            [ ${#files[@]} -gt 0 ] || { echo "::error::no sources for clang-tidy"; exit 1; }
            printf '%s\n' "${files[@]}" | xargs -P "$(nproc)" -n 1 clang-tidy-20 -p "out/tidy-$build" \
              --quiet --warnings-as-errors='*'
            echo "::endgroup::"
          done

  # Every cell builds with warnings as errors and runs its whole suite, the
  # header tests included. The Linux cells run the PipeWire, PulseAudio and
  # ALSA suites against a private sound server that ctest starts for them
  # (tools/pipewire_daemon.sh). linux-gcc-14 builds both parts with every
  # Linux backend, as CodeQL does. macOS plays into BlackHole, a virtual
  # device, since the runners have no audio hardware.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14 }
          - { preset: linux-clang-20 }
          - { preset: linux-clang-20-asan, repeat: 3 }
          - { preset: linux-clang-20-tsan }
          - { preset: linux-shared }
          - { preset: linux-device-only }
          - { preset: linux-spatial-only }
          - { preset: linux-private-backend }
          - { preset: macos-clang, runner: macos-15, setup: tools/ci_blackhole.sh }
          - { preset: windows-clang-cl, runner: windows-2025 }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@8414d388d2116b581c5c5d8f6641e1da4d863244 # v0.0.42
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      repeat: ${{ matrix.repeat || 1 }}
      setup: ${{ matrix.setup || '' }}
      # The sound-server fixture's daemon logs, when a cell fails.
      logs: out/${{ matrix.preset }}/sound-server/*.log

  # The extended run's desktop cells: MemorySanitizer
  # (the sound servers' libraries are not instrumented, so the integration
  # suites stay out), the macOS sanitizers and Linux on arm64.
  extended:
    if: github.event_name == 'schedule' || inputs.nightly
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-clang-20-msan }
          - { preset: linux-gcc-14, runner: ubuntu-24.04-arm }
          - { preset: macos-clang-asan, runner: macos-15, setup: tools/ci_blackhole.sh }
          - { preset: macos-clang-tsan, runner: macos-15, setup: tools/ci_blackhole.sh }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@8414d388d2116b581c5c5d8f6641e1da4d863244 # v0.0.42
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      setup: ${{ matrix.setup || '' }}
      # The sound-server fixture's daemon logs, when a cell fails.
      logs: out/${{ matrix.preset }}/sound-server/*.log
      timeout: 60

  # The quarantined Linux suites against the sound-server fixture, through
  # tools/run_quarantine.sh: a quarantined test's failure is a known flake,
  # reported in the job summary and as a warning, while a skip, a
  # sanitizer report or a crash fails the job. The shared workflow runs a
  # preset's tests with ctest alone, so this cell is its own job.
  quarantine:
    if: github.event_name == 'schedule' || inputs.nightly
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      # An init reaps the daemons the sound-server fixture stops.
      options: --init
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake --preset linux-quarantine
          cmake --build --preset linux-quarantine
      # The base test preset's options, which the runner's ctest call does
      # not read: the runner's own 300 s timeout matches the preset's, so a
      # hung suite times out as a known flake instead of running the job out
      # of time; a lost label fails the night.
      - name: Quarantined suites
        run: tools/run_quarantine.sh out/linux-quarantine -j 4 --no-tests=error
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-linux-quarantine
          path: |
            out/linux-quarantine/Testing/Temporary/
            out/linux-quarantine/sound-server/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The public headers alone under MSVC's cl, as C17 and C++17 with /W4 /WX:
  # consumers may compile them with it, though it cannot build the library.
  msvc-headers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B out/headers
          cmake --build out/headers --config Release

  # The two loaders of hostile files under libFuzzer, one cell per target,
  # from the committed seeds and the shipped files (tools/fuzz_seeds.sh):
  # briefly on a pull request, longer on main, ten minutes at night. Each
  # target's corpus carries from run to run in a cache of its own. Every
  # run restores it first (the newest of that target's), a pull request's
  # included, so a change that breaks a harness's promise fails on its own
  # pull request. A pull request neither minimizes it with libFuzzer's
  # merge nor saves it, and only main saves it.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.nightly) && 25 || 15 }}
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_hrtf, fuzz_bake]
    env:
      TARGET: ${{ matrix.target }}
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 20 || (github.event_name == 'schedule' || inputs.nightly) && 600 || 90 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Build
        run: |
          cmake -B out/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON -D${PREFIX}_DEVICE=OFF \
            -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_BENCH=OFF -D${PREFIX}_BUILD_SAMPLES=OFF \
            -D${PREFIX}_WERROR=ON
          cmake --build out/fuzz --target "$TARGET"
      - name: Run
        run: |
          tools/fuzz_seeds.sh out/corpus
          # tools/fuzz_target.sh reports a finding without its input, and
          # keeps the input and the log on the runner.
          rm -rf out/fuzz-reports
          status=0
          tools/fuzz_target.sh "out/fuzz/$TARGET" -max_total_time="$FUZZ_SECONDS" \
            "out/corpus/$TARGET" || status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          exit "$status"
      # Both run only after a run with no finding: a finding's input never
      # reaches the cache.
      # tools/fuzz_target.sh --merge prints no log and fails when the
      # merge met a finding, which libFuzzer's own merge does not.
      - name: Minimize the corpus
        if: success() && github.event_name != 'pull_request'
        run: |
          rm -rf out/fuzz-reports
          status=0
          tools/fuzz_target.sh --merge "out/fuzz/$TARGET" "out/merged/$TARGET" "out/corpus/$TARGET" ||
            status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          [ "$status" -eq 0 ] || exit "$status"
          rm -rf "out/corpus/$TARGET"
          mv "out/merged/$TARGET" "out/corpus/$TARGET"
      - name: Save the corpus
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

  # The web backend built by Emscripten: the suites under Node, the pages in
  # headless Chrome through puppeteer (test/web/package-lock.json pins it),
  # and what each feature costs a page. The quarantined pages run at night
  # only. The job runs in the CI image, with Emscripten from the emsdk
  # action, so that Chrome plays into the private sound server's null sink
  # (the sound-server fixture): a runner has no output device of its own,
  # and a page whose device Chrome loses tests nothing.
  web-emscripten:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      # Chrome keeps its shared memory in /dev/shm, 64 MB in a container;
      # an init reaps the daemons the sound-server fixture stops.
      options: --init --shm-size=2g
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: Build
        run: |
          cmake --preset web-emscripten
          cmake --build --preset web-emscripten -j 4
      - name: Browser
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          cp test/web/package.json test/web/package-lock.json "$RUNNER_TEMP/browser/"
          npm ci --prefix "$RUNNER_TEMP/browser"
          echo "MAUD_PUPPETEER=$RUNNER_TEMP/browser/node_modules/puppeteer" >> "$GITHUB_ENV"
      - name: Test
        run: |
          ctest --preset web-emscripten | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      # A quarantined page's failure is a known flake, reported in the
      # job summary; a skip, a sanitizer report or a crash fails the step.
      - name: Quarantined pages
        if: github.event_name == 'schedule' || inputs.nightly
        run: tools/run_quarantine.sh out/web-emscripten --no-tests=error
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-emscripten
          path: |
            out/web-emscripten/Testing/Temporary/
            out/web-emscripten/sound-server/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Size
        # The static library, and what each feature costs a page: its
        # program linked alone (bench/size_web.c), raw and gzipped, and the
        # HRTF set, which a page fetches.
        run: |
          stat -c '%s bytes' out/web-emscripten/libmaul-audio.a
          for f in out/web-emscripten/maul-audio_size_*.wasm out/web-emscripten/maul-audio_size_*.js \
            data/hrtf/*.maudhrtf; do
            echo "$f: $(stat -c %s "$f") bytes, $(gzip -9c "$f" | wc -c) gzipped"
          done

  # The AAudio backend in the emulator, Android 11 (the oldest the backend
  # takes) on x86_64 with KVM: the suites through adb, the Java half as an
  # application built by R8 without Gradle. The emulator plays without a
  # host audio connection and refuses the shell's recording, so capture is
  # tested to its refusal. The runner carries the SDK and the NDK. The
  # emulator and its system image are pinned to their archives in the SDK
  # repository, by URL and sha256, and a cache keyed by the pins holds
  # them unpacked: a run downloads the archives only on a miss, checks
  # their sums, and main's runs then save them. The SDK manager would
  # install whatever its channel holds that day, so it installs neither.
  # Moving a pin takes the new archive's URL and sha256 (its index,
  # repository2-3.xml, gives the sha1 to check the download against).
  android-emulator:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_SERIAL: emulator-5554
      ANDROID_AVD_HOME: /home/runner/.android/avd
      MAUD_REQUIRE_AAUDIO: 1
      EMULATOR_REVISION: 37.2.13
      EMULATOR_ARCHIVE: https://dl.google.com/android/repository/emulator-linux_x64-16740729.zip
      EMULATOR_SHA256: cbc7c3cfb83220b8a0f9c513fdab557712e74d339ec19ddffa43f23350ae9bdd
      SYSTEM_IMAGE_REVISION: "16"
      SYSTEM_IMAGE_ARCHIVE: https://dl.google.com/android/repository/sys-img/google_apis/x86_64-30_r16.zip
      SYSTEM_IMAGE_SHA256: daae27654be74ae83a484daea4db2c0c77b4f4ad661a645bd5f36d96ce03e4d5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's own emulator goes first, so a restore never mixes
      # with it.
      - name: Clear the runner's emulator
        run: |
          [ "$ANDROID_HOME" = /usr/local/lib/android/sdk ] ||
            { echo "::error::the SDK moved to $ANDROID_HOME; move the cache paths with it"; exit 1; }
          rm -rf "$ANDROID_HOME/emulator"
      - name: Restore the emulator and its system image
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-30/google_apis/x86_64
          key: android-emulator-${{ env.EMULATOR_SHA256 }}-${{ env.SYSTEM_IMAGE_SHA256 }}
      - name: Boot the emulator
        timeout-minutes: 15
        env:
          SDK_CACHE_HIT: ${{ steps.sdk-cache.outputs.cache-hit }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses >/dev/null 2>&1 || true
          # Runner images move to newer NDKs: the pinned one is installed
          # when the image lacks it.
          [ -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ] ||
            "$tools/sdkmanager" --install "ndk;${ANDROID_NDK_HOME##*/}" >/dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          image="$ANDROID_HOME/system-images/android-30/google_apis/x86_64"
          if [ "$SDK_CACHE_HIT" != true ]; then
            unpack() { # archive URL, its sha256, the directory it unpacks into
              curl -fsSL -o "$RUNNER_TEMP/package.zip" "$1"
              echo "$2  $RUNNER_TEMP/package.zip" | sha256sum -c --quiet ||
                { echo "::error::$1 is not the archive pinned by its sha256"; exit 1; }
              mkdir -p "$3"
              unzip -q "$RUNNER_TEMP/package.zip" -d "$3"
              rm "$RUNNER_TEMP/package.zip"
            }
            rm -rf "$image"
            unpack "$EMULATOR_ARCHIVE" "$EMULATOR_SHA256" "$ANDROID_HOME"
            unpack "$SYSTEM_IMAGE_ARCHIVE" "$SYSTEM_IMAGE_SHA256" "${image%/*}"
          fi
          # The SDK's tools know a package by the package.xml the SDK
          # manager writes as it installs one, which an archive lacks.
          # They still read a system image's source.properties, but
          # avdmanager refuses an emulator without a package.xml: this is
          # the one the SDK manager writes, but the license text. Every run
          # writes it, hit or miss, so it always comes from this text: a
          # copy the cache holds is overwritten before anything reads it.
          IFS=. read -r major minor micro <<<"$EMULATOR_REVISION"
          cat >"$ANDROID_HOME/emulator/package.xml" <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <ns2:repository xmlns:ns2="http://schemas.android.com/repository/android/common/02"
              xmlns:ns3="http://schemas.android.com/repository/android/generic/02">
            <localPackage path="emulator" obsolete="false">
              <type-details xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:type="ns3:genericDetailsType"/>
              <revision><major>$major</major><minor>$minor</minor><micro>$micro</micro></revision>
              <display-name>Android Emulator</display-name>
            </localPackage>
          </ns2:repository>
          XML
          revision() { sed -n 's/^Pkg.Revision=//p' "$1/source.properties"; }
          emulator_revision=$(revision "$ANDROID_HOME/emulator")
          image_revision=$(revision "$image")
          if [ "$emulator_revision" != "$EMULATOR_REVISION" ] || [ "$image_revision" != "$SYSTEM_IMAGE_REVISION" ]; then
            echo "::error::emulator $emulator_revision and system image $image_revision installed, $EMULATOR_REVISION and $SYSTEM_IMAGE_REVISION pinned: move the pins"
            exit 1
          fi
          echo no | "$tools/avdmanager" create avd -n maud30 -k "system-images;android-30;google_apis;x86_64" -d pixel_5 >/dev/null
          nohup "$ANDROID_HOME/emulator/emulator" -avd maud30 -no-window -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -port 5554 > emulator.log 2>&1 &
          emulator=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          for i in $(seq 1 90); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            kill -0 "$emulator" 2>/dev/null || break
            sleep 5
          done
          "$adb" shell getprop sys.boot_completed | grep -q 1 || { tail -50 emulator.log; exit 1; }
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      # Only main's runs save, as the fuzz corpus does: a pull request's
      # cache would hold another copy for its branch alone.
      - name: Save the emulator and its system image
        if: steps.sdk-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-30/google_apis/x86_64
          key: android-emulator-${{ env.EMULATOR_SHA256 }}-${{ env.SYSTEM_IMAGE_SHA256 }}
      - name: Build
        run: |
          cmake --preset android-emulator
          cmake --build --preset android-emulator -j 4
      - name: Test
        run: |
          ctest --preset android-emulator | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      # The stall test's verdict on its window, added to the summary from
      # what CTest recorded of every test's output, since the test cannot
      # reach the summary from the device itself. The line it greps is
      # test/test_stall.c's (Report): "stall window: " and the verdict.
      - name: Stall verdict
        if: always()
        env:
          LOG: out/android-emulator/Testing/Temporary/LastTest.log
        run: |
          lines=$(grep -h -o 'stall window: .*' "$LOG" 2>/dev/null || true)
          if [ -n "$lines" ]; then
            printf '%s\n' "$lines" | sed "s/^stall window: /- \`stall\`: timing checks /"
          else
            echo "- \`stall\`: no stall verdict found"
          fi >>"$GITHUB_STEP_SUMMARY"
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-android-emulator
          path: out/android-emulator/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The iOS backend: built with its tests on every pull request, the only
  # cell that compiles it, and run in the simulator on main and every
  # night, since a simulator's boot and first launch take minutes on the
  # macOS runners, more than the pull request check's budget leaves. The
  # simulator's microphone and speaker are the runner's default devices,
  # which BlackHole is made, since the runner's own virtual device can stall
  # capture. The AddressSanitizer build is the extended run's.
  ios-simulator:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON((github.event_name == 'schedule' || inputs.nightly) && '["ios-simulator", "ios-simulator-asan"]' || '["ios-simulator"]') }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PRESET: ${{ matrix.preset }}
      RUN: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET" -j 4
      - name: BlackHole as the default devices
        if: env.RUN == 'true'
        run: |
          tools/ci_blackhole.sh
          clang -std=c2x -Wall -Werror test/ios/default_device.c -framework CoreAudio \
            -framework CoreFoundation -o "$RUNNER_TEMP/default_device"
          "$RUNNER_TEMP/default_device" BlackHole2ch_UID
      - name: Boot a simulator
        if: env.RUN == 'true'
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r),
                            key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "MAUD_IOS_DEVICE=$udid" >> "$GITHUB_ENV"
      - name: Test
        if: env.RUN == 'true'
        run: |
          ctest --preset "$PRESET" | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      # The stall test's verdict on its window, added to the summary from
      # what CTest recorded of every test's output, since the test cannot
      # reach the summary from the device itself. The line it greps is
      # test/test_stall.c's (Report): "stall window: " and the verdict.
      - name: Stall verdict
        if: always() && env.RUN == 'true'
        env:
          LOG: out/${{ matrix.preset }}/Testing/Temporary/LastTest.log
        run: |
          lines=$(grep -h -o 'stall window: .*' "$LOG" 2>/dev/null || true)
          if [ -n "$lines" ]; then
            printf '%s\n' "$lines" | sed "s/^stall window: /- \`stall\`: timing checks /"
          else
            echo "- \`stall\`: no stall verdict found"
          fi >>"$GITHUB_STEP_SUMMARY"
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.preset }}
          path: out/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The one check the ruleset requires: it passes when every job above
  # passed or was skipped, so adding or renaming a job never touches the
  # ruleset.
  # Deletes the cache entries of main that a newer save replaced, after
  # every job that saves one: the per-commit ccache and mesa entries of the
  # build cells, the fuzz corpora by run, and the emulator once it saves.
  # Main's runs only; on a pull request it is skipped.
  prune-caches:
    needs: [build, extended, fuzz, android-emulator]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: Rawframe-Project/.github/.github/workflows/cache-prune.yml@8414d388d2116b581c5c5d8f6641e1da4d863244 # v0.0.42
    permissions:
      actions: write

  required:
    if: always()
    needs: [changes, docs, zizmor, checks, build, extended, quarantine, msvc-headers, fuzz, web-emscripten, android-emulator, ios-simulator, prune-caches]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
