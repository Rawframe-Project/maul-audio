# Continuous integration for Maul Audio.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PREFIX: MAUL_AUDIO

jobs:
  # The rules no compiler checks: formatting, static analysis and the
  # family's source, module, documentation and length checks.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-20 clang-tidy-20 ninja-build libpipewire-0.3-dev libpulse-dev libasound2-dev
          pip install clang-format==22.1.5 >/dev/null
      - name: clang-format
        run: |
          clang-format --version
          clang-format --dry-run -Werror $(find include src test tools bench samples -name '*.[ch]' 2>/dev/null)
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
      - name: clang-tidy
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          # Only the sources this build compiles; the Windows and web
          # backends are compiled, with warnings as errors, by their cells.
          for f in src/*.c; do
            grep -q "\"file\": \"$PWD/$f\"" build/compile_commands.json || continue
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done

  # Every cell builds with warnings as errors and runs the whole suite,
  # the header tests included.
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-14,        os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "" }
          - { name: linux-clang-20,      os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "" }
          - { name: linux-clang-20-asan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_AUDIO_SANITIZE=ON" }
          - { name: linux-clang-20-tsan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_AUDIO_TSAN=ON" }
          - { name: linux-shared,        os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "-DMAUL_AUDIO_BUILD_SHARED=ON" }
          # Each part alone: it links only if neither part uses the other.
          - { name: linux-device-only,   os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "-DMAUL_AUDIO_SPATIAL=OFF" }
          - { name: linux-spatial-only,  os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "-DMAUL_AUDIO_DEVICE=OFF" }
          - { name: linux-arm64-gcc-14,  os: ubuntu-24.04-arm, cc: gcc-14, cxx: g++-14,   config: Release, extra: "" }
          - { name: macos-clang,         os: macos-15,     cc: clang,    cxx: clang++,    config: Release, extra: "" }
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-14 g++-14 clang-20 ninja-build libpipewire-0.3-dev libpulse-dev libasound2-dev
      - name: Install BlackHole
        # The runners have no audio hardware; the CoreAudio test plays
        # into this virtual device.
        if: runner.os == 'macOS'
        run: |
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          sleep 5
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -D${PREFIX}_WERROR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.extra }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export MAUD_REQUIRE_COREAUDIO=1
            export MAUD_TEST_COREAUDIO_RESTART="sudo killall coreaudiod"
          fi
          ctest --test-dir build --output-on-failure
      - name: Private backend
        # A backend built from outside src/ (docs/private-backends.md): it
        # takes the native slot, so only its test and the context's run.
        if: matrix.name == 'linux-device-only'
        run: |
          cmake -B build-private -DCMAKE_BUILD_TYPE=${{ matrix.config }} -D${PREFIX}_WERROR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.extra }} \
            -D${PREFIX}_PRIVATE_BACKEND="$PWD/test/private_backend"
          cmake --build build-private -j 4 --target test_private_backend test_context
          ctest --test-dir build-private -R "^(private_backend|context)$" --output-on-failure
      - name: Package
        if: matrix.name == 'linux-shared'
        run: cmake --install build --prefix "$PWD/package"

  # Each fuzz target runs for one minute on every push, from the shipped
  # files as seeds: the HRTF set behind a 0x01 byte, the bakes behind a
  # 0x03 (CMakeLists.txt says what the bytes choose). The loaders are
  # the Spatial part's, so the Device part is not built.
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        timeout-minutes: 15
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-20 libclang-rt-20-dev ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_DEVICE=OFF -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_BENCH=OFF \
            -D${PREFIX}_BUILD_SAMPLES=OFF -D${PREFIX}_WERROR=ON
          cmake --build build
      - name: Run
        run: |
          mkdir -p corpus-fuzz_hrtf corpus-fuzz_bake
          { printf '\001'; cat data/hrtf/sadie2-ku100-48k.maudhrtf; } > corpus-fuzz_hrtf/seed
          { printf '\003'; cat data/bake/office.maudbake; } > corpus-fuzz_bake/seed
          { printf '\003'; cat data/bake/office-v1.maudbake; } > corpus-fuzz_bake/seed-v1
          for target in build/fuzz_*; do
            "$target" -max_total_time=60 "corpus-$(basename $target)"
          done

  windows-clang-cl:
    name: windows-clang-cl
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -B build -T ClangCL -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # The public headers alone under MSVC's cl, as C17 and C++17 with
      # /W4 /WX, which cannot build the library itself (family record 0008).
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B build-headers
          cmake --build build-headers --config Release

  ios:
    # iOS in the simulator: every test through simctl spawn, on an iPhone
    # of the newest runtime. The simulator plays through the runner's
    # output, which BlackHole provides.
    name: ios-simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install BlackHole
        run: |
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          sleep 5
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r),
                            key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "MAUD_IOS_DEVICE=$udid" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/ios-simulator.cmake
          -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Audio devices
        # The simulator's microphone is the runner's default input: which
        # device that is, for the capture test's occasional stalls.
        run: system_profiler SPAudioDataType | sed -n '1,80p'
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  android:
    # The AAudio backend in the emulator, Android 11 (the oldest the
    # backend takes) on x86_64 with KVM: every test through adb
    # (tools/run_android.sh). The emulator plays without a host audio
    # connection and refuses the shell's recording, so capture is tested
    # to its refusal. The runner carries the SDK and NDK r28; the
    # emulator and its image are installed here.
    name: android-emulator
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_SERIAL: emulator-5554
      ANDROID_AVD_HOME: /home/runner/.android/avd
      MAUD_REQUIRE_AAUDIO: 1
    steps:
      - uses: actions/checkout@v7
      - name: Boot the emulator
        timeout-minutes: 15
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses >/dev/null 2>&1 || true
          # Runner images move to newer NDKs: the pinned one is installed when
          # the image lacks it.
          [ -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ] ||
            "$tools/sdkmanager" --install "ndk;${ANDROID_NDK_HOME##*/}" >/dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          "$tools/sdkmanager" --install emulator "system-images;android-30;google_apis;x86_64" >/dev/null
          echo no | "$tools/avdmanager" create avd -n maud30 -k "system-images;android-30;google_apis;x86_64" -d pixel_5 >/dev/null
          nohup "$ANDROID_HOME/emulator/emulator" -avd maud30 -no-window -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -port 5554 > emulator.log 2>&1 &
          emulator=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          for i in $(seq 1 90); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            kill -0 "$emulator" 2>/dev/null || break
            sleep 5
          done
          "$adb" shell getprop sys.boot_completed | grep -q 1 || { tail -50 emulator.log; exit 1; }
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Configure
        run: >
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/android-emulator.cmake
          -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  web:
    name: web-emscripten
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: emscripten-core/setup-emsdk@v16
      - name: Configure
        run: emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: |
          for t in build/test_*.js; do node "$t" || exit 1; done
      - name: Browser
        # The web backend in headless Chrome, on a cross-origin isolated
        # page and on a plain one, and with the microphone refused. The
        # page checks timing on a shared runner, so each run gets a second
        # attempt; a real failure fails both.
        run: |
          npm install --prefix "$RUNNER_TEMP/web" puppeteer@25.12.0
          export MAUD_PUPPETEER="$RUNNER_TEMP/web/node_modules/puppeteer"
          for mode in "1" "0" "0 deny"; do
            node test/web/run_page.js build page_web.html $mode ||
              node test/web/run_page.js build page_web.html $mode || exit 1
          done
      - name: Size
        # The static library's size, reported, not gated (family record
        # 0013), and what each feature costs a page: its program linked
        # alone (bench/size_web.c), raw and gzipped, and the HRTF set.
        run: |
          stat -c '%s bytes' build/libmaul-audio.a
          for f in build/maul-audio_size_*.wasm build/maul-audio_size_*.js data/hrtf/*.maudhrtf; do
            echo "$f: $(stat -c %s "$f") bytes, $(gzip -9c "$f" | wc -c) gzipped"
          done
