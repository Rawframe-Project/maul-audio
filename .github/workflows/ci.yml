# Continuous integration: the pull request check, the full check on main,
# and every night the extended run (MemorySanitizer, the macOS and iOS
# sanitizer cells, Linux on arm64, quarantined pages, long fuzzing). Each
# desktop build cell is a CMake preset built by the organization's shared
# workflow; the cells that need a simulator, an emulator or a browser, and
# the other jobs, are here, each through its preset too.
# docs/operations/checks.md explains each job, and tools/check.sh runs the
# Linux ones locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  PREFIX: MAUL_AUDIO

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@c836a14bfdf2ed83329d08e6bd6d7667fac3e8d2 # v0.0.10
    permissions:
      pull-requests: read

  # The organization's documentation check. data/hrtf/apache-2.0 holds the
  # HRTF set's license exactly as published.
  docs:
    uses: Rawframe-Project/.github/.github/workflows/docs-check.yml@c836a14bfdf2ed83329d08e6bd6d7667fac3e8d2 # v0.0.10
    permissions:
      contents: read
    with:
      exclude: data/hrtf/apache-2.0

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@c836a14bfdf2ed83329d08e6bd6d7667fac3e8d2 # v0.0.10
    permissions:
      contents: read

  # The rules no compiler checks: formatting, the family's source, module,
  # length, API documentation and snippet checks, the engine-free API, the
  # README's cost table, the documentation site, and clang-tidy over the
  # Linux build's sources. It runs on documentation changes too, since the
  # snippet check and the site read docs/.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.6@sha256:50c383f608f992c272196139d749f15978e35143a2876362b1e0aef6993480bd
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        run: |
          clang-format --version
          mapfile -t files < <(git ls-files 'include/*.h' 'src/*.[chm]' 'test/*.[chm]' 'tools/*.[ch]' \
            'bench/*.[ch]' 'samples/*.[ch]')
          [ ${#files[@]} -gt 0 ] || { echo "::error::no C files to check"; exit 1; }
          clang-format --dry-run -Werror "${files[@]}"
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
          python3 tools/check_litmus.py
      - name: README cost table
        run: python3 tools/cost_table.py --check
      - name: The documentation site builds
        run: python3 tools/build_docs.py
      - name: clang-tidy
        # The Linux build's sources; the other platforms' code is compiled
        # with warnings as errors by its own cell.
        run: |
          cmake -B out/tidy -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D${PREFIX}_BUILD_TESTS=OFF
          cmake --build out/tidy
          mapfile -t files < <(python3 -c "import json; print('\n'.join(sorted({e['file'] for e in json.load(open('out/tidy/compile_commands.json')) if '/src/' in e['file']})))")
          [ ${#files[@]} -gt 0 ] || { echo "::error::no sources for clang-tidy"; exit 1; }
          for f in "${files[@]}"; do clang-tidy-20 -p out/tidy --quiet --warnings-as-errors='*' "$f"; done

  # Every cell builds with warnings as errors and runs its whole suite, the
  # header tests included. The Linux cells run the PipeWire, PulseAudio and
  # ALSA suites against a private sound server that ctest starts for them
  # (tools/pipewire_daemon.sh). linux-gcc-14 builds both parts with every
  # Linux backend, as CodeQL does. macOS plays into BlackHole, a virtual
  # device, since the runners have no audio hardware.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14 }
          - { preset: linux-clang-20 }
          - { preset: linux-clang-20-asan, repeat: 3 }
          - { preset: linux-clang-20-tsan }
          - { preset: linux-shared }
          - { preset: linux-device-only }
          - { preset: linux-spatial-only }
          - { preset: linux-private-backend }
          - { preset: macos-clang, runner: macos-15, setup: tools/ci_blackhole.sh }
          - { preset: windows-clang-cl, runner: windows-2025 }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@c836a14bfdf2ed83329d08e6bd6d7667fac3e8d2 # v0.0.10
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      repeat: ${{ matrix.repeat || 1 }}
      setup: ${{ matrix.setup || '' }}

  # The extended run's desktop cells, at night and by hand: MemorySanitizer
  # (the sound servers' libraries are not instrumented, so the integration
  # suites stay out), the macOS sanitizers, and Linux on arm64.
  extended:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-clang-20-msan }
          - { preset: linux-gcc-14, runner: ubuntu-24.04-arm }
          - { preset: macos-clang-asan, runner: macos-15, setup: tools/ci_blackhole.sh }
          - { preset: macos-clang-tsan, runner: macos-15, setup: tools/ci_blackhole.sh }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@c836a14bfdf2ed83329d08e6bd6d7667fac3e8d2 # v0.0.10
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      setup: ${{ matrix.setup || '' }}
      timeout: 60

  # The public headers alone under MSVC's cl, as C17 and C++17 with /W4 /WX:
  # consumers may compile them with it, though it cannot build the library.
  msvc-headers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B out/headers
          cmake --build out/headers --config Release

  # The two loaders of hostile files under libFuzzer, from the committed
  # seeds and the shipped files (tools/fuzz_seeds.sh): briefly on a pull
  # request, longer on main, ten minutes each at night. The corpus carries
  # from run to run in a cache, restored first, minimized with libFuzzer's
  # merge and saved from main only.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'schedule' && 40 || 15 }}
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.6@sha256:50c383f608f992c272196139d749f15978e35143a2876362b1e0aef6993480bd
    permissions:
      contents: read
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 20 || github.event_name == 'schedule' && 600 || 90 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Build
        run: |
          cmake -B out/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON -D${PREFIX}_DEVICE=OFF \
            -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_BENCH=OFF -D${PREFIX}_BUILD_SAMPLES=OFF \
            -D${PREFIX}_WERROR=ON
          cmake --build out/fuzz
      - name: Run
        run: |
          tools/fuzz_seeds.sh out/corpus
          mkdir -p out/fuzz-logs
          for target in out/fuzz/fuzz_*; do
            name=$(basename "$target")
            if "$target" -max_total_time="$FUZZ_SECONDS" "out/corpus/$name" >"out/fuzz-logs/$name.log" 2>&1; then
              echo "$name: no finding"
            else
              tail -n 60 "out/fuzz-logs/$name.log"
              echo "::error::$name found something"
              exit 1
            fi
          done
      - name: Minimize the corpus
        if: github.event_name != 'pull_request'
        run: |
          for target in out/fuzz/fuzz_*; do
            name=$(basename "$target")
            mkdir -p "out/merged/$name"
            "$target" -merge=1 "out/merged/$name" "out/corpus/$name" >/dev/null 2>&1
            rm -rf "out/corpus/$name"
            mv "out/merged/$name" "out/corpus/$name"
            echo "$name: $(find "out/corpus/$name" -type f | wc -l) inputs"
          done
      - name: Save the corpus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Fuzz logs and crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz
          path: |
            out/fuzz-logs/
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore
          retention-days: 7

  # The web backend built by Emscripten: the suites under Node, the pages in
  # headless Chrome through puppeteer (test/web/package-lock.json pins it),
  # and what each feature costs a page. The quarantined pages run at night
  # only. The job runs in the CI image, with Emscripten from the emsdk
  # action, so that Chrome plays into the private sound server's null sink
  # (the sound-server fixture): a runner has no output device of its own,
  # and a page whose device Chrome loses tests nothing.
  web-emscripten:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.6@sha256:50c383f608f992c272196139d749f15978e35143a2876362b1e0aef6993480bd
      # Chrome keeps its shared memory in /dev/shm, 64 MB in a container.
      options: --shm-size=2g
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: Build
        run: |
          cmake --preset web-emscripten
          cmake --build --preset web-emscripten -j 4
      - name: Browser
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          cp test/web/package.json test/web/package-lock.json "$RUNNER_TEMP/browser/"
          npm ci --prefix "$RUNNER_TEMP/browser"
          echo "MAUD_PUPPETEER=$RUNNER_TEMP/browser/node_modules/puppeteer" >> "$GITHUB_ENV"
      - name: Test
        run: |
          ctest --preset web-emscripten | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Quarantined pages
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          ctest --test-dir out/web-emscripten -L '^quarantine$' --output-on-failure --no-tests=error |
            tee "$RUNNER_TEMP/quarantine.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/quarantine.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-emscripten
          path: out/web-emscripten/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
      - name: Size
        # The static library, and what each feature costs a page: its
        # program linked alone (bench/size_web.c), raw and gzipped, and the
        # HRTF set, which a page fetches.
        run: |
          stat -c '%s bytes' out/web-emscripten/libmaul-audio.a
          for f in out/web-emscripten/maul-audio_size_*.wasm out/web-emscripten/maul-audio_size_*.js \
            data/hrtf/*.maudhrtf; do
            echo "$f: $(stat -c %s "$f") bytes, $(gzip -9c "$f" | wc -c) gzipped"
          done

  # The AAudio backend in the emulator, Android 11 (the oldest the backend
  # takes) on x86_64 with KVM: the suites through adb, the Java half as an
  # application built by R8 without Gradle. The emulator plays without a
  # host audio connection and refuses the shell's recording, so capture is
  # tested to its refusal. The runner carries the SDK and the NDK; the
  # emulator and its system image come from the SDK manager.
  android-emulator:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_SERIAL: emulator-5554
      ANDROID_AVD_HOME: /home/runner/.android/avd
      MAUD_REQUIRE_AAUDIO: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Boot the emulator
        timeout-minutes: 15
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses >/dev/null 2>&1 || true
          # Runner images move to newer NDKs: the pinned one is installed
          # when the image lacks it.
          [ -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ] ||
            "$tools/sdkmanager" --install "ndk;${ANDROID_NDK_HOME##*/}" >/dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          "$tools/sdkmanager" --install emulator "system-images;android-30;google_apis;x86_64" >/dev/null
          echo no | "$tools/avdmanager" create avd -n maud30 -k "system-images;android-30;google_apis;x86_64" -d pixel_5 >/dev/null
          nohup "$ANDROID_HOME/emulator/emulator" -avd maud30 -no-window -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -port 5554 > emulator.log 2>&1 &
          emulator=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          for i in $(seq 1 90); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            kill -0 "$emulator" 2>/dev/null || break
            sleep 5
          done
          "$adb" shell getprop sys.boot_completed | grep -q 1 || { tail -50 emulator.log; exit 1; }
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build
        run: |
          cmake --preset android-emulator
          cmake --build --preset android-emulator -j 4
      - name: Test
        run: |
          ctest --preset android-emulator | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-android-emulator
          path: out/android-emulator/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The iOS backend: built with its tests on every pull request, the only
  # cell that compiles it, and run in the simulator on main and every
  # night, since a simulator's boot and first launch take minutes on the
  # macOS runners, more than the pull request check's budget leaves. The
  # simulator's microphone and speaker are the runner's default devices,
  # which BlackHole is made, since the runner's own virtual device can stall
  # capture. The AddressSanitizer build is the extended run's.
  ios-simulator:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ios-simulator", "ios-simulator-asan"]' || '["ios-simulator"]') }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PRESET: ${{ matrix.preset }}
      RUN: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET" -j 4
      - name: BlackHole as the default devices
        if: env.RUN == 'true'
        run: |
          tools/ci_blackhole.sh
          clang -std=c2x -Wall -Werror test/ios/default_device.c -framework CoreAudio \
            -framework CoreFoundation -o "$RUNNER_TEMP/default_device"
          "$RUNNER_TEMP/default_device" BlackHole2ch_UID
      - name: Boot a simulator
        if: env.RUN == 'true'
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r),
                            key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "MAUD_IOS_DEVICE=$udid" >> "$GITHUB_ENV"
      - name: Test
        if: env.RUN == 'true'
        run: |
          ctest --preset "$PRESET" | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.preset }}
          path: out/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The one check the ruleset requires: it passes when every job above
  # passed or was skipped, so adding or renaming a job never touches the
  # ruleset.
  required:
    if: always()
    needs: [changes, docs, zizmor, checks, build, extended, msvc-headers, fuzz, web-emscripten, android-emulator, ios-simulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
