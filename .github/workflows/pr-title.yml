# The pull request title becomes the commit on main and the changelog
# line, so it must be a conventional commit with one of the scopes
# AGENTS.md lists.
name: pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    uses: Rawframe-Project/.github/.github/workflows/pr-title.yml@3044ba71d36f3e3eb370b8915ca1b02f337fda8c # v0.0.41
    permissions:
      pull-requests: read
    with:
      scopes: context device stream offline voice pipewire pulse alsa wasapi coreaudio ios aaudio web hrtf binaural ambisonics speakers direct reverb scene spatializer bake build bench family
